<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header>
			<h1>Creatingly Interview Project</h1>
			<h2>Web Scrapper</h2>
		</header>
		<main>
			<section class="url-section">
				<input
					type="text"
					placeholder="Enter url (https://...)"
					id="url-input"
					value="https://corsproxy.io/?https://en.wikipedia.org/wiki/Wikipedia:Good_articles/By_length"
					class="url-input"
				/>
				<button class="fetch-button" id="fetch-url-button" disabled>Fetch</button>
			</section>
			<section class="info-section">
				<p id="error-msg" class="error-msg"></p>
				<div id="result" class="result">
					<ol id="tags-list" class="tags-list"></ol>
				</div>
			</section>
		</main>
	</body>
</html>
